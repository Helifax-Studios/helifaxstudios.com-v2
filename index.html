<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helifax Studios // Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ECEFF4;
            background: transparent;
        }

        /* Shifting Galaxy Gradient Background (Layer 0) */
        .galaxy-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #d8b4fe, #9333ea, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: shiftGradient 18s ease infinite;
            z-index: 0;
        }

        @keyframes shiftGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Starfield Container (Layer 1) */
        .starfield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Individual Star Styling with Smoother, Slower Wave Transitions */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.95), 0 0 24px 8px rgba(216, 180, 252, 0.8);
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            /* Slower 3.2s transition so you can appreciate the wave motion */
            transition: transform 3.2s cubic-bezier(0.16, 1, 0.3, 1) var(--delay, 0s), opacity 3.2s ease var(--delay, 0s);
        }

        .star.converging {
            transform: translate(calc(50vw - var(--pos-x)), calc(50vh - var(--pos-y))) scale(0.15);
            opacity: 0.3; /* Keeps them visible longer during the inward sweep */
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Gateway Overlay Container (Layer 2) */
        .gateway-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background: rgba(15, 13, 25, 0.15);
            backdrop-filter: blur(2px);
            transition: opacity 0.5s ease;
        }

        /* Quote Display */
        .quote-box {
            max-width: 600px;
            margin-bottom: 40px;
            min-height: 80px;
            transition: opacity 0.5s ease;
        }

        .quote-text {
            font-size: 1.4rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            color: #f3e8ff;
        }

        /* Enter Button */
        .enter-btn {
            position: relative;
            padding: 14px 42px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.4), rgba(147, 51, 234, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(161, 131, 199, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease, box-shadow 3.2s ease, transform 3.2s ease, background 3.2s ease;
            z-index: 10;
        }

        .enter-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.6), rgba(168, 85, 247, 0.85));
            box-shadow: 0 0 35px rgba(192, 132, 252, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* Button Charging State */
        .enter-btn.charging {
            transform: scale(1.25);
            background: rgba(255, 255, 255, 1);
            color: #1e1b4b;
            box-shadow: 0 0 120px 45px rgba(255, 255, 255, 0.95), inset 0 0 40px rgba(147, 51, 234, 0.95);
            border-color: #ffffff;
        }

        /* Blinding White Flash Overlay (Layer 100) */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.6s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .flash-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="galaxy-background"></div>
    <div class="starfield" id="starfieldContainer"></div>
    <div class="flash-overlay" id="flashOverlay"></div>

    <audio id="bg-music" loop>
        <source src="your-ambient-track.mp3" type="audio/mpeg">
    </audio>

    <div class="gateway-container" id="gateway">
        <div class="quote-box" id="quoteBox">
            <p class="quote-text" id="quote-display">Loading...</p>
        </div>
        <button class="enter-btn" id="enterBtn" onclick="enterSite()">Enter</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('starfieldContainer');
            const starCount = 100;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                
                star.style.left = `${x}vw`;
                star.style.top = `${y}vh`;
                
                star.style.setProperty('--pos-x', `${x}vw`);
                star.style.setProperty('--pos-y', `${y}vh`);

                // Calculate distance from center for wave stagger effect
                const dx = x - 50;
                const dy = y - 50;
                const distance = Math.sqrt(dx * dx + dy * dy); // 0 to ~70
                const waveDelay = (distance / 70) * 1.1; // Wider delay spread for a distinct wave ripple
                star.style.setProperty('--delay', `${waveDelay}s`);

                const size = `${Math.random() * 3 + 1.5}px`;
                star.style.width = size;
                star.style.height = size;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                
                if (container) {
                    container.appendChild(star);
                }
            }

            // Rotating Quotes Engine with Random Start
            const quotes = [
                "\"A life without the fear of death isn't living.\"",
                "\"Creation is just ordering chaos into a melody.\"",
                "\"Every horizon is just a starting line.\""
            ];
            
            let currentQuote = Math.floor(Math.random() * quotes.length);
            const quoteEl = document.getElementById('quote-display');
            if (quoteEl) {
                quoteEl.innerText = quotes[currentQuote];
            }
            
            const quoteInterval = setInterval(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                if (quoteEl) {
                    quoteEl.style.opacity = 0;
                    setTimeout(() => {
                        quoteEl.innerText = quotes[currentQuote];
                        quoteEl.style.opacity = 1;
                    }, 500);
                }
            }, 6000);

            // Enter Action
            window.enterSite = function() {
                clearInterval(quoteInterval);

                const audio = document.getElementById('bg-music');
                if (audio) {
                    audio.play().catch(err => {
                        console.warn("[Audio] Playback skipped or file missing:", err);
                    });
                }

                const btn = document.getElementById('enterBtn');
                const quoteBox = document.getElementById('quoteBox');
                const flashOverlay = document.getElementById('flashOverlay');

                if (quoteBox) quoteBox.style.opacity = 0;
                if (btn) btn.classList.add('charging');

                // Trigger wave convergence
                const starNodes = document.querySelectorAll('.star');
                starNodes.forEach(star => {
                    star.style.animation = 'none'; 
                    star.classList.add('converging');
                });

                // Trigger white flash right as the wave finishes sweeping inward
                setTimeout(() => {
                    if (flashOverlay) flashOverlay.classList.add('active');
                }, 2800);

                // Hide gateway container after flash peak
                setTimeout(() => {
                    const gateway = document.getElementById('gateway');
                    if (gateway) gateway.style.display = 'none';
                }, 3400);
            };
        });
    </script>
</body>
</html>
