<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helifax Studios // Gateway Diagnostics</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ECEFF4;
            background: #1e1b4b;
        }

        /* Shifting Galaxy Gradient Background */
        .galaxy-background {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #d8b4fe, #9333ea, #1e1b4b, #311042);
            background-size: 400% 400%;
            animation: shiftGradient 18s ease infinite;
            z-index: -2;
        }

        @keyframes shiftGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Starfield Container */
        .starfield {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
            transition: transform 1s cubic-bezier(0.55, 0.085, 0.68, 0.53), opacity 1s ease;
            transform-origin: center center;
        }

        .starfield.converging {
            transform: scale(0);
            opacity: 0;
        }

        /* Individual Star Styling */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.95), 0 0 24px 8px rgba(216, 180, 252, 0.8);
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        /* Gateway Overlay */
        .gateway-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background: rgba(15, 13, 25, 0.15);
            backdrop-filter: blur(2px);
            transition: opacity 0.5s ease;
        }

        /* Quote Display */
        .quote-box {
            max-width: 600px;
            margin-bottom: 40px;
            min-height: 80px;
            transition: opacity 0.5s ease;
        }

        .quote-text {
            font-size: 1.4rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.8);
            color: #f3e8ff;
        }

        /* Enter Button */
        .enter-btn {
            position: relative;
            padding: 14px 42px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.4), rgba(147, 51, 234, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(161, 131, 199, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease, box-shadow 1s ease, transform 1s ease, background 1s ease;
            z-index: 10;
        }

        .enter-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.6), rgba(168, 85, 247, 0.85));
            box-shadow: 0 0 35px rgba(192, 132, 252, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .enter-btn.charging {
            transform: scale(1.25);
            background: rgba(255, 255, 255, 1);
            color: #1e1b4b;
            box-shadow: 0 0 100px 40px rgba(255, 255, 255, 0.95), inset 0 0 40px rgba(147, 51, 234, 0.95);
            border-color: #ffffff;
        }

        /* Blinding White Flash Overlay */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .flash-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="galaxy-background"></div>
    <div class="starfield" id="starfieldContainer"></div>
    <div class="flash-overlay" id="flashOverlay"></div>

    <audio id="bg-music" loop>
        <source src="your-ambient-track.mp3" type="audio/mpeg">
    </audio>

    <div class="gateway-container" id="gateway">
        <div class="quote-box" id="quoteBox">
            <p class="quote-text" id="quote-display">"Life without death is one without a purpose."</p>
        </div>
        <button class="enter-btn" id="enterBtn" onclick="enterSite()">Enter</button>
    </div>

    <script>
        console.log("[Script Parse] HTML parser reached script block.");

        window.addEventListener('DOMContentLoaded', () => {
            console.log("[DOM Event] DOMContentLoaded fired successfully.");

            // Verify starfield container
            const container = document.getElementById('starfieldContainer');
            if (!container) {
                console.error("[DOM Error] #starfieldContainer element was NOT found in the document!");
            } else {
                console.log("[DOM Success] #starfieldContainer acquired.");
            }

            // Generate star elements
            const starCount = 95;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * 100}vw`;
                star.style.top = `${Math.random() * 100}vh`;
                
                const size = `${Math.random() * 3 + 1.5}px`;
                star.style.width = size;
                star.style.height = size;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                
                if (container) {
                    container.appendChild(star);
                }
            }
            console.log(`[Starfield Generator] Successfully injected ${starCount} star nodes into container. Container children count: ${container ? container.children.length : 'N/A'}`);

            // Rotating Quotes Engine
            const quotes = [
                "\"Life without death is one without a purpose.\"",
                "\"Creation is just ordering chaos into a melody.\"",
                "\"Every horizon is just a starting line.\""
            ];
            let currentQuote = 0;
            console.log("[Quotes Engine] Initialized.");
            
            const quoteInterval = setInterval(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                console.log(`[Quotes Engine] Cycling to quote index: ${currentQuote}`);
                const quoteEl = document.getElementById('quote-display');
                if (quoteEl) {
                    quoteEl.style.opacity = 0;
                    setTimeout(() => {
                        quoteEl.innerText = quotes[currentQuote];
                        quoteEl.style.opacity = 1;
                    }, 500);
                } else {
                    console.warn("[Quotes Warning] #quote-display element missing.");
                }
            }, 6000);

            // Enter Action
            window.enterSite = function() {
                console.log("[User Interaction] 'Enter' button clicked! enterSite() executing...");
                clearInterval(quoteInterval);

                const audio = document.getElementById('bg-music');
                if (audio) {
                    audio.play().then(() => {
                        console.log("[Audio] Playback started.");
                    }).catch(err => {
                        console.warn("[Audio Warning] Playback blocked or file missing (expected if 404):", err);
                    });
                }

                const btn = document.getElementById('enterBtn');
                const quoteBox = document.getElementById('quoteBox');
                const flashOverlay = document.getElementById('flashOverlay');
                const starfieldContainer = document.getElementById('starfieldContainer');

                if (quoteBox) quoteBox.style.opacity = 0;
                if (btn) {
                    btn.classList.add('charging');
                    console.log("[Animation] Added 'charging' class to Enter button.");
                }

                if (starfieldContainer) {
                    starfieldContainer.classList.add('converging');
                    console.log("[Animation] Added 'converging' class to starfield container.");
                }

                setTimeout(() => {
                    if (flashOverlay) {
                        flashOverlay.classList.add('active');
                        console.log("[Animation] Blinding white flash overlay activated.");
                    }
                }, 850);

                setTimeout(() => {
                    const gateway = document.getElementById('gateway');
                    if (gateway) {
                        gateway.style.display = 'none';
                        console.log("[Animation] Gateway container hidden. Sequence complete.");
                    }
                }, 1250);
            };
        });
    </script>
</body>
</html>
