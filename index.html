<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helifax Studios // Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #ECEFF4;
            background: #1e1b4b;
        }

        /* Unified Canvas Layer for Gradient, Stars, and Animations */
        #coreCanvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
        }

        /* Gateway Overlay Container */
        .gateway-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            background: rgba(15, 13, 25, 0.2);
            backdrop-filter: blur(2px);
            transition: opacity 0.5s ease;
        }

        /* Quote Display */
        .quote-box {
            max-width: 600px;
            margin-bottom: 40px;
            min-height: 80px;
            transition: opacity 0.5s ease;
        }

        .quote-text {
            font-size: 1.4rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0,0,0,0.7);
            color: #f3e8ff;
        }

        /* Enter Button */
        .enter-btn {
            position: relative;
            padding: 14px 42px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.4), rgba(147, 51, 234, 0.6));
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(161, 131, 199, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease, box-shadow 1s ease, transform 1s ease, background 1s ease;
            z-index: 10;
        }

        .enter-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(135deg, rgba(161, 131, 199, 0.6), rgba(168, 85, 247, 0.85));
            box-shadow: 0 0 35px rgba(192, 132, 252, 0.9), inset 0 0 15px rgba(255, 255, 255, 0.6);
        }

        /* Button Charging State */
        .enter-btn.charging {
            transform: scale(1.25);
            background: rgba(255, 255, 255, 1);
            color: #1e1b4b;
            box-shadow: 0 0 100px 40px rgba(255, 255, 255, 0.95), inset 0 0 40px rgba(147, 51, 234, 0.95);
            border-color: #ffffff;
        }

        /* Blinding White Flash Overlay */
        .flash-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.4s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .flash-overlay.active {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Unified Canvas handles gradient background and stars -->
    <canvas id="coreCanvas"></canvas>
    <div class="flash-overlay" id="flashOverlay"></div>

    <audio id="bg-music" loop>
        <source src="your-ambient-track.mp3" type="audio/mpeg">
    </audio>

    <div class="gateway-container" id="gateway">
        <div class="quote-box" id="quoteBox">
            <p class="quote-text" id="quote-display">"Life without death is one without a purpose."</p>
        </div>
        <button class="enter-btn" id="enterBtn" onclick="enterSite()">Enter</button>
    </div>

    <script>
        const canvas = document.getElementById('coreCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Gradient animation variables
        let gradientProgress = 0;

        // Starfield setup
        const stars = [];
        const starCount = 90;
        let isConverging = false;

        for (let i = 0; i < starCount; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2.2 + 1.2,
                alpha: Math.random() * 0.7 + 0.3,
                twinkleSpeed: Math.random() * 0.02 + 0.008
            });
        }

        function renderFrame() {
            // 1. Draw Shifting Galaxy Gradient Background
            gradientProgress += 0.002;
            const x1 = canvas.width * (0.5 + Math.sin(gradientProgress) * 0.5);
            const y1 = canvas.height * (0.5 + Math.cos(gradientProgress * 0.8) * 0.5);
            
            const grad = ctx.createLinearGradient(x1, y1, canvas.width - x1, canvas.height - y1);
            grad.addColorStop(0, '#d8b4fe'); // Light lavender
            grad.addColorStop(0.35, '#9333ea'); // Purple
            grad.addColorStop(0.7, '#1e1b4b'); // Dark blue
            grad.addColorStop(1, '#311042'); // Deep nebula

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw and Animate Stars
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            stars.forEach(star => {
                if (isConverging) {
                    // Pull stars rapidly toward the center button coordinates
                    star.x += (centerX - star.x) * 0.12;
                    star.y += (centerY - star.y) * 0.12;
                } else {
                    // Natural twinkling
                    star.alpha += star.twinkleSpeed;
                    if (star.alpha > 1 || star.alpha < 0.25) {
                        star.twinkleSpeed *= -1;
                    }
                }

                ctx.beginPath();
                ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(216, 180, 252, 0.9)';
                ctx.fill();
            });

            requestAnimationFrame(renderFrame);
        }
        renderFrame();

        // --- Rotating Quotes Engine ---
        const quotes = [
            "\"Life without death is one without a purpose.\"",
            "\"Creation is just ordering chaos into a melody.\"",
            "\"Every horizon is just a starting line.\""
        ];
        let currentQuote = 0;
        const quoteInterval = setInterval(() => {
            currentQuote = (currentQuote + 1) % quotes.length;
            const quoteEl = document.getElementById('quote-display');
            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteEl.innerText = quotes[currentQuote];
                quoteEl.style.opacity = 1;
            }, 500);
        }, 6000);

        // --- Enter Action ---
        function enterSite() {
            clearInterval(quoteInterval);
            const audio = document.getElementById('bg-music');
            audio.play().catch(() => {});

            const btn = document.getElementById('enterBtn');
            const quoteBox = document.getElementById('quoteBox');
            const flashOverlay = document.getElementById('flashOverlay');

            // Fade out quote text
            quoteBox.style.opacity = 0;

            // Trigger button glow charging state
            btn.classList.add('charging');

            // Trigger canvas star vortex convergence
            isConverging = true;

            // Trigger blinding white flash after stars converge into the button
            setTimeout(() => {
                flashOverlay.classList.add('active');
            }, 850);

            // Clean up gateway view after flash hits peak
            setTimeout(() => {
                document.getElementById('gateway').style.display = 'none';
            }, 1250);
        }
    </script>
</body>
</html>
